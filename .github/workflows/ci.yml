name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Deliberately no `paths:` filters: a required check from a workflow that never ran blocks PRs forever.

permissions:
  contents: read

# A newer push to the same PR supersedes the older run. Runs on main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # GitHub runs this as `bash -eo pipefail`, so any failing command fails the step

jobs:
  quality-gate:
    # Stable name: this exact string is what branch protection must require.
    name: API Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: 127.0.0.1
      PORT: "3000"
      API_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Same command as `npm start`. Node is launched directly so that $! is the server's own PID,
      # which lets the readiness check detect a crash and the cleanup step stop exactly this process.
      - name: Start API in background
        run: |
          node dist/server.js > api.log 2>&1 &
          echo $! > api.pid
          echo "Started API with PID $(cat api.pid)"

      - name: Wait for API readiness (30 s limit)
        run: |
          # Wall-clock deadline (not an attempt count), so slow or hanging probes cannot stretch the limit.
          deadline=$((SECONDS + 30))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$(cat api.pid)" 2>/dev/null; then
              echo "::error title=API crashed::API process exited before becoming ready"
              echo "----- api.log -----"; cat api.log
              exit 1
            fi
            if curl --silent --fail --max-time 2 "$API_BASE_URL/health" > /dev/null; then
              echo "API ready after ${SECONDS}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error title=API readiness timeout::GET $API_BASE_URL/health did not succeed within 30 s"
          echo "----- api.log -----"; cat api.log
          exit 1

      # The exit status of this step is the quality gate. Nothing below may turn a failure into a success.
      - name: Run API tests
        timeout-minutes: 5
        run: npm run test:api

      # Runs only when everything above succeeded: a green run without a report is an invalid run.
      - name: Require JUnit report
        if: ${{ success() }}
        run: test -s reports/junit.xml

      - name: Print API log
        if: ${{ failure() }}
        run: |
          if [ -f api.log ]; then
            echo "----- api.log -----"; cat api.log
          fi

      # Best-effort diagnostics. !cancelled() (not always()) so a cancelled run does not wait on uploads.
      # `warn` because an early failure (e.g. npm ci) legitimately leaves no files; the original failure stays the job result.
      - name: Upload test report and API log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-gate-diagnostics-${{ github.run_attempt }}
          path: |
            reports/junit.xml
            api.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop API
        if: ${{ always() }}
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
          fi
